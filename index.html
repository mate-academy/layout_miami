<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBike Landing Page</title>
    <link rel="stylesheet" href="src/styles/main.scss">
  </head>
  <body>

    <header class="header">
      <div class="header__container">

        <a href="#" class="header__logo-link">
          <img src="src/images/logo-white.svg" alt="MyBike"
          class="header__logo">
        </a>

        <div class="header__actions">

          <a href="tel:+12345555555" class="header__phone"
          aria-label="Call us">
            <span class="header__phone-text">+1 234 555-55-55</span>
            <svg width="22" height="22"
            viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"
            >
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </a>

          <button class="header__menu-btn" aria-label="Open menu">
            <span class="header__menu-lines"></span>
          </button>
        </div>

      </div>
    </header>

    <main>
      <section class="hero" id="home">
        <div class="hero__container">
          <h1 class="hero__title">Take the Streets</h1>
        </div>
      </section>

      <section class="about" id="about-us">
        <div class="about__container">
          <h2 class="about__title">Move Free</h2>
          <p class="about__text">
          Shift your ride, not gears. Find the fastest way to move in the city as the bike adapts intuitively to power the speed you need.
          </p>
        </div>
      </section>
    </main>

  </body>
</html>
